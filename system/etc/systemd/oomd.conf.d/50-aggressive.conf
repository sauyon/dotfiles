# Goes to: /etc/systemd/oomd.conf.d/50-aggressive.conf
#
# SwapUsedLimit is deliberately left at the upstream default (90%). It is an
# ABSOLUTE swap-fullness check, not a measure of whether anything is actually
# struggling -- and on fujiwara swap usage is structural, not distress:
#
#   - kubelet sets memory.swap.max=0 on pods, so kubepods.slice can never swap.
#     llama-server's ~18G is pinned resident and everything it displaces is paid
#     for out of user.slice's swap budget.
#   - 60-workstation-reserve.conf's MemoryMin=16G floor pushes user.slice anon
#     pages out as a matter of steady-state accounting.
#   - zswap is on, so a large share of "swap used" is RAM-backed and fast
#     (13.4G Zswapped compressed into 4.8G resident at time of writing).
#
# A 50% limit here fired at 31G -- below this host's normal operating point --
# and systemd-oomd killed three SSH login-session scopes in one day (sessions
# 645, 652 and 661 on 2026-08-28) while memory PSI was flat 0.00 everywhere.
# The kills were pure false positives; nothing had stalled on memory at all.
#
# The real guard is DefaultMemoryPressureLimit below, which is PSI-based: it
# measures the fraction of wall-clock time tasks spent BLOCKED on memory
# (reclaim, refaults, thrashing). That is the signal that means the machine is
# in trouble, and it stays tightened well past upstream's 60%/20s.
[OOM]
SwapUsedLimit=90%
DefaultMemoryPressureLimit=40%
DefaultMemoryPressureDurationSec=10s
