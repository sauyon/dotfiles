# Build the Linux home-manager closures in CI and push them to attic, so
# `home-manager switch` on the boxes just downloads instead of compiling.
#
# Migrated from `.woodpecker/nix-home.yml` (2026-08-03). The old pipeline ran a
# dedicated Woodpecker pod; this runs inside the shared in-cluster
# `forgejo-runner`, whose jobs execute as containers under its privileged DinD
# sidecar. See the kube repo's docs/forgejo-dotfiles-ci.md for the migration
# notes and the runner sizing that makes this viable.
#
# mari (aarch64-darwin) is intentionally omitted — an x86_64-linux job can't
# build darwin; darwin still builds on mari itself.
name: nix-home

on:
  push:
    branches: [master]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "*.nix"
      - "home/**"
      - "patches/**"
      - ".forgejo/workflows/nix-home.yml"
  # Forgejo has no re-run API (docs/forgejo-registry.md in the kube repo), so a
  # dispatch trigger is the only way to replay this after an infra failure
  # without pushing an empty commit.
  workflow_dispatch:

# A closure build runs for tens of minutes on a runner shared with every other
# repo. Without this, pushing twice in quick succession leaves two of them
# compiling concurrently inside the same 16Gi dind cgroup.
concurrency:
  group: nix-home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Run the job directly in the nix image rather than installing nix into the
    # default catthehacker image. NOTE: this image has git and bash but NO node,
    # so no JS action (actions/checkout included) can run here — every step below
    # must be a plain `run:`, and the checkout is done by hand.
    #
    # It deliberately does NOT ask for `--privileged`; see `build-users-group`
    # below for what pays for that. The image ships `sandbox = false` in
    # /etc/nix/nix.conf, and turning the sandbox back on is what would require
    # the privilege (it needs CLONE_NEWUSER and mounts).
    #
    # 2.34.8. The version is pinned between a floor and a ceiling, so do not
    # bump it casually in either direction:
    #
    #   FLOOR (>= ~2.26): home.nix sets `programs.gpg.package` at one line and
    #   opens `programs = { … gpg = { … } … }` at another. Newer nix merges those
    #   two bindings; the 2.24.10 the Woodpecker pipelines pinned rejects the
    #   second with `error: attribute 'gpg' already defined`, which reads like a
    #   config typo rather than a toolchain mismatch.
    #
    #   CEILING (< 2.35.1): 2.35.1 aborts partway through building this closure
    #   with an internal scheduler assertion —
    #     Assertion '!awake.empty()' failed in nix::Worker::run at worker.cc:360
    #   an upstream bug, not anything this repo can fix. 2.34.8 is the closest
    #   published tag to the 2.34.6 the workstation builds this flake with daily.
    container:
      image: nixos/nix@sha256:1a711b619c8a713eff32c3f8d8781b3b4d0130cb91c0a57f67e87abfeeb90b01
    env:
      # One place for nix's config instead of repeating --extra-* on every
      # invocation. The `kube` cache PUBLIC key is public (it is also in
      # flake.nix) — only the token below is a secret.
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        netrc-file = /root/.config/nix/netrc
        extra-substituters = https://attic.ko.ag/kube
        extra-trusted-public-keys = kube:YLRejBKnIVKqvZRXBvFR4KmosPZPg9phiM+pRlhbQ+c=
        # fujiwara has 32 cores, so `max-jobs = auto` would start up to 32
        # concurrent builds — inside a cgroup limited to 16Gi, and sharing it
        # with whatever else the runner is executing. Bound it. The wall-clock
        # cost is small because most of a run is substitution, not compilation.
        max-jobs = 6
        cores = 4
        # Run builds as root (single-user nix) instead of as the image's
        # unprivileged `nixbld` users. Required, not a shortcut:
        #
        # fujiwara has fs.protected_hardlinks=1, and nix store paths are
        # root-owned mode 444. A non-root builder therefore cannot hardlink a
        # store file — that needs CAP_FOWNER. Derivations that hardlink out of a
        # store path die with
        #   EPERM: Operation not permitted: failed to link package: …
        # (hunkdiff's bun install is the one that hits it here). It looks like a
        # broken package and is not.
        #
        # This does not reproduce locally because Determinate runs with the
        # sandbox ON, and nix's sandbox maps the builder into a user namespace
        # where it IS root, so CAP_FOWNER applies. With `sandbox = false` there
        # is no such mapping. The two ways out are a privileged container with
        # the sandbox re-enabled, or this. Builds already run as root in an
        # ephemeral container, so root here concedes nothing extra.
        build-users-group =
    steps:
      # attic.ko.ag is NOT anonymously readable — an unauthenticated request to
      # /kube/nix-cache-info returns 401. nix treats a substituter it cannot
      # reach as simply absent and says nothing, so the Woodpecker version of
      # this pipeline (which only logged in AFTER building) silently substituted
      # nothing and rebuilt from scratch every run. Write the credential FIRST.
      # nix reads netrc as HTTP basic; attic accepts the JWT as the password.
      - name: authorise nix against attic
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -eu
          mkdir -p /root/.config/nix
          umask 077
          printf 'machine attic.ko.ag password %s\n' "$ATTIC_TOKEN" \
            > /root/.config/nix/netrc

      # Hand-rolled checkout: see the `container:` note above. Full clone, not
      # --depth 1 — the repo is ~14MB and a shallow clone cannot check out an
      # arbitrary SHA.
      - name: checkout
        run: |
          set -eu
          git clone https://forge.ko.ag/${{ github.repository }}.git .
          git checkout --detach ${{ github.sha }}
          git --no-pager log -1 --oneline

      # Build every Linux host's activation package. Unchanged paths are
      # substituted from attic (now that the netrc exists) and cache.nixos.org.
      - name: build home closures
        run: |
          set -eu
          nix build --no-link --print-out-paths \
            .#homeConfigurations.utsuho.activationPackage \
            .#homeConfigurations.setsuna.activationPackage \
            .#homeConfigurations.fujiwara.activationPackage \
            | tee /tmp/out-paths

      # The image has no attic-client; run it pinned from a fixed nixpkgs rev
      # (the same rev the kube repo's nix pipeline pins). Do NOT echo
      # $ATTIC_TOKEN or enable `set -x` in this step.
      - name: push closures to attic
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -eu
          ATTIC=github:NixOS/nixpkgs/29916453413845e54a65b8a1cf996842300cd299#attic-client
          nix run "$ATTIC" -- login ko https://attic.ko.ag "$ATTIC_TOKEN"
          # Unquoted on purpose: one argument per out-path. Store paths cannot
          # contain whitespace, so word-splitting is the intended behaviour.
          nix run "$ATTIC" -- push ko:kube $(cat /tmp/out-paths)
