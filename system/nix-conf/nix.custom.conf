# Written by https://github.com/DeterminateSystems/nix-installer.
# On Determinate Nix, /etc/nix/nix.conf auto-`!include`s this file; on plain
# upstream nix (e.g. utsuho) system/deploy appends the `!include` itself.
# `extra-*` settings APPEND to nix's compiled-in defaults (cache.nixos.org,
# FlakeHub) rather than replacing them, so the public caches are preserved.
#
# Managed by dotfiles (system/nix-conf/nix.custom.conf), spliced by
# system/deploy via system/nix-conf.sh. A Determinate reinstall/repair may
# overwrite the installed file; re-run system/deploy.

# Self-hosted attic binary cache on the kube cluster.
#
# Substituted over the in-cluster Service, NOT the public `https://attic.ko.ag/kube`.
# Every box reaches the cluster's network either directly (LAN) or through WireGuard
# (Kon — see `system/deploy`), so `attic.attic.svc.cluster.local` resolves and the
# request stays on the cluster's pod network. Cloudflare drops out of the path
# entirely, which is the surface the 601 s response ceiling lived on — the same
# move the CI workflows already made (see `.forgejo/workflows/nix-home.yml`).
# On http, not https: the Service is cluster-internal, terminates TLS at the attic
# pod, and boxes are inside the same trust boundary.
#
# The cache is PRIVATE regardless of which URL is used, so the read-only pull token
# still has to reach nix via netrc. `system/deploy` renders it from sops to
# /etc/determinate/netrc.custom (Determinate) and /etc/nix/netrc (plain nix). The
# `machine` line in those netrc entries MUST match this host — netrc is matched
# on host, so a stale `attic.ko.ag` line there silently auths the wrong URL.
# The signing key below is public, not URL-scoped.
extra-substituters = http://attic.attic.svc.cluster.local/kube
extra-trusted-public-keys = kube:YLRejBKnIVKqvZRXBvFR4KmosPZPg9phiM+pRlhbQ+c=

# Remote builder: delegate aarch64-darwin derivations to mari (the only darwin
# machine). The nix daemon (root) SSHes as nixremote using the key rendered to
# /etc/nix/mari-builder-key (from sops, by system/deploy). mari authorizes this
# builder key for the dedicated `nixremote` user and exempts it from the OIDC
# ForceCommand gate via a Match block (see flake.nix darwinConfigurations.mari)
# — deploy mari first. `nixremote` (NOT sauyon): the gate ForceCommand would
# hijack a sauyon-user non-interactive build; the nixremote carve-out bypasses it.
#
# The builders line itself is @NIX_BUILDERS@ -- spliced by system/deploy from
# dotfiles-private (endpoints.nix: nixBuildersLine), because the target's LAN
# address and host-key pin are topology this public repo does not carry, and
# the daemon reads this file before any home-manager generation exists. The
# topology (LAN-not-Tailscale, lease-drift re-pin procedure) is documented in
# dotfiles-private/docs/darwin-remote-builder.md.
builders = @NIX_BUILDERS@
builders-use-substitutes = true


# ── trusted user ─────────────────────────────────────────────────────────────
# Make the human login a nix trusted-user. Until this landed the daemon trusted
# only root, so any restricted setting this account passed was dropped with a
# warning and the build carried on against the system values:
#
#   $ nix store info --option substituters https://example.invalid
#   warning: ignoring untrusted substituter 'https://example.invalid', you are
#   not a trusted user.
#   Trusted: 0
#
# That is the whole effect being bought: a one-off `--option substituters ...`,
# a `--builders` override, a flake's own `nixConfig`, `nix copy` to a remote
# store -- honoured instead of silently ignored. It changes nothing about the
# settings above; they remain the system default every build starts from.
#
# This grant can only live at the system level. A non-trusted user cannot vote
# itself trusted from ~/.config/nix/nix.conf -- trusted-users is itself a
# restricted setting, so the daemon ignores it from exactly the account that
# would want to set it. Hence here, deployed by system/deploy, and NOT in
# home.nix.
#
# `extra-` form, like every setting above: trusted-users defaults to `root`, and
# the plain form would REPLACE that list rather than add to it. Dropping root is
# not a theoretical loss -- it is the account the daemon's own operations and
# every `sudo nix` run as.
#
# Said plainly, because it is the real cost: a trusted user can point the daemon
# at any substituter with any signing key it likes, and can turn the sandbox
# off. On a single-human workstation where that account is already in wheel and
# runs system/deploy under sudo, it grants nothing it could not already take.
# On a box with other humans on it, it would be a privilege boundary dissolved.
extra-trusted-users = sauyon
