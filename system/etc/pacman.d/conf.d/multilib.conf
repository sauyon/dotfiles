# Arch's 32-bit repository. Off in the stock /etc/pacman.conf, and needed by
# anything with a lib32- dependency -- today that is steam, in
# ../../../packages.shiori.
#
# This is a drop-in rather than an edit of /etc/pacman.conf because that file is
# pacman's own backup file: owning a copy of it here would turn pacman's changes
# into .pacnew nobody reads. ../../../deploy instead appends one glob Include to
# it, whole-line matched and only once, and the repo owns the section itself.
#
# pacman processes Include inline, and deploy appends at the end of the file, so
# this section is parsed after [core] and [extra] -- the position Arch's stock
# config gives multilib.
#
# Enabling a repo installs nothing on its own: system/packages.<host> stays the
# only thing that decides what a box gets. Its sync db is a separate matter --
# a newly enabled repo has none until someone runs `pacman -Syu`, and deploy
# says so rather than letting pacman call steam a bad target.
[multilib]
Include = /etc/pacman.d/mirrorlist
