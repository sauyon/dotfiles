creation_rules:
  - path_regex: secrets.yaml
    # host-key alone, as of Part A item 4 (reports/…trust root.md). Every
    # dotfiles principal now reaches it through its own WIF device identity --
    # home.nix `wifHosts` for the user configs, darwinConfigurations.mari for
    # mari's system config -- so nix-key, the cluster service account's key that
    # every host used to share, is no longer a recipient. It was dropped once
    # all four principals were enrolled AND the live JWKS served all four kids;
    # dropping it earlier would have locked out whichever host was still on the
    # shared credential.
    #
    # Editing this list does NOT re-wrap the existing file -- `sops updatekeys
    # secrets.yaml` does, under a credential holding ENCRYPT on host-key (the
    # device identities are decrypt-only by design, so none of them can).
    # tests/sops-recipients.sh is what notices when that step was forgotten.
    #
    # Recovery root is the Cryptomator vault on the personal Drive:
    # passphrase-encrypted, scrypt N=32768, format 8, SIV_CTRMAC; a storage
    # compromise yields ciphertext and an offline attack bounded by the
    # passphrase, not by KMS availability. No paper print required.
    gcp_kms: "projects/sauyon-dotfiles/locations/global/keyRings/nix-keyring/cryptoKeys/host-key"
    # Offline paper recovery (report A6.4, A7 step 1). Same creation rule as
    # gcp_kms, so it is the same key group: this recipient ALONE decrypts, with
    # no Google account and no network. Do not move it into `key_groups` -- that
    # is a Shamir AND, and a paper key that needs a second share is not a
    # recovery path. The private half lives only on paper: unrevocable, its use
    # unlogged, so replacing it also means rotating the secrets, because the old
    # ciphertext stays in git history where the old key still opens it.
    # Generator: install/wif/paper-keygen.sh. Cases: tests/sops-recipients.sh.
    age: "age1yz709y8yjpa6e20w5xsgg62hv73ejuelldrg290fn95nzdzhhpws7jqrsf"
